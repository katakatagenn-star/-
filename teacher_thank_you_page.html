<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff5f8">
<title>先生へ、ありがとう！</title>
<style>
:root{--ink:#352c40;--muted:#766b80;--pink:#d77ca4;--lav:#8a79c6;--paper:#fffdfd}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(140deg,#f1edff,#fff1f5 58%,#fff8e8)}
main{width:min(100%,540px);background:rgba(255,255,255,.88);border:1px solid #fff;border-radius:28px;padding:28px 22px;box-shadow:0 18px 55px rgba(87,66,120,.13);text-align:center}
.kicker{font-size:.76rem;letter-spacing:.18em;font-weight:800;color:var(--lav)}
h1{font-size:clamp(2rem,8vw,2.8rem);line-height:1.3;margin:12px 0}
.intro{line-height:1.85;color:var(--muted);margin:0 auto 22px}
.photo{height:220px;border:2px dashed #d9cfe8;border-radius:18px;background:linear-gradient(135deg,#fbf8ff,#fff8fb);display:flex;align-items:center;justify-content:center;color:#8b7e9d;margin:20px 0 24px}
.photo span{display:block;font-size:.9rem}
.photo .camera{font-size:2.3rem;margin-bottom:8px}
h2{font-size:1.2rem;margin:0 0 12px}
.message{text-align:left;white-space:pre-line;line-height:2;background:#fff8fb;border:1px solid #f4dfeb;border-radius:18px;padding:20px 18px}
.closing{font-size:1.2rem;font-weight:800;color:#8066bd;margin:22px 0 0}
.flower{font-size:1.7rem;margin-top:12px}
footer{font-size:.75rem;color:#9a90a4;margin-top:22px}
@media(prefers-reduced-motion:no-preference){main{animation:in .65s ease-out}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
  <div class="kicker">A LITTLE MESSAGE FOR YOU</div>
  <h1>先生へ、<br>ありがとう！</h1>
  <p class="intro">教育実習、本当にお疲れさまでした。<br>感謝の気持ちを込めて。</p>
  <div class="photo" role="img" aria-label="思い出の写真をあとから入れる場所">
    <div><div class="camera">📷</div><span>ここに思い出の写真が入ります</span><span>（写真はあとから追加できます）</span></div>
  </div>
  <h2>先生へのメッセージ 💌</h2>
  <div class="message">先生、教育実習本当にお疲れさまでした！

先生と一緒に過ごした時間は、僕たちにとって大切な思い出です。

授業でいろいろなことを教えてくれたり、楽しい時間を過ごさせてくれたり、本当にありがとうございました！

これからも先生らしく、夢に向かって頑張ってください！

クラスみんなで応援しています！</div>
  <div class="closing">先生、ありがとうございました！</div>
  <div class="flower">🌸 💐 🌸</div>
  <footer>感謝を込めて、クラスのみんなより</footer>
</main>
</body>
</html>
